ad: Karınca Yolu
ton: 'Tür: Diğer. Mikroskobik bir dünyanın detaylarına inen, keşif ve hayatta kalma odaklı bir macera.'
oyuncu: karınca. Kraliçenin yeni yiyecek deposu bulma emriyle yola çıktı. Yanında sırt çantası (küçük
  bir tohum için), koku bezleri ve 3 yiyecek parçacığı var.
giris: Sabahın ilk ışıklarıyla uyanıyorsun. Etrafında hareketli işçi karıncalar vızıldıyor, her biri kendi
  görevine koşuşturuyor. Yuvanın nemli toprağı ve fermente olmuş yiyeceklerin kokusu burnuna doluyor.
  Kraliçenin fısıltısı, yeni bir günün başladığını haber veriyor.
baslangic_mekan: ana_yuva
baslangic_zamani: 1. gün, sabah
para_birimi: yiyecek parçacığı
oyuncu_esyalar:
- sırt çantası (küçük bir tohum için)
- koku bezleri
oyuncu_akce: 3
kurallar:
- 'Dönem ve teknoloji: Günümüz, ancak insan teknolojisinden bağımsız, doğal bir karınca kolonisi yaşamı.'
- İnsan karakterler
- Büyük ölçekli teknolojiler
- Doğaüstü olaylar
vaatler:
- Koloninin eski kraliçesi neden ortadan kayboldu?
- Karıncalar için kutsal sayılan Büyük Yaprak Nerede?
