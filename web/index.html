<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuzhan</title>
<style>
  :root {
    --zemin: #f4ecdf; --kagit: #fffaf2; --murekkep: #2b2118; --soluk: #7b6a57;
    --cizgi: #e4d6c0; --vurgu: #a8471f; --vurgu-yumusak: #f3dcc9; --replik: #f6ead9;
    --kirmizi: #a3322a; --kirmizi-zemin: #f8e1dd; --yesil: #3f6f45; --yesil-zemin: #e3efe1;
    --mavi: #34607f; --mavi-zemin: #e1ebf2; --golge: 0 1px 3px rgba(60,40,20,.10), 0 6px 20px rgba(60,40,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="acik"]) {
      --zemin: #17130f; --kagit: #211b16; --murekkep: #eee3d2; --soluk: #a5937c;
      --cizgi: #3a2f26; --vurgu: #e38b5c; --vurgu-yumusak: #3b2a1e; --replik: #2a221b;
      --kirmizi: #ec8b80; --kirmizi-zemin: #3a211d; --yesil: #93c08f; --yesil-zemin: #1f2d20;
      --mavi: #8fbbd9; --mavi-zemin: #1c2a35; --golge: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-tema="koyu"] {
    --zemin: #17130f; --kagit: #211b16; --murekkep: #eee3d2; --soluk: #a5937c;
    --cizgi: #3a2f26; --vurgu: #e38b5c; --vurgu-yumusak: #3b2a1e; --replik: #2a221b;
    --kirmizi: #ec8b80; --kirmizi-zemin: #3a211d; --yesil: #93c08f; --yesil-zemin: #1f2d20;
    --mavi: #8fbbd9; --mavi-zemin: #1c2a35; --golge: 0 1px 3px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--zemin); color: var(--murekkep);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Üst çubuk */
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--cizgi); background: var(--kagit); position: sticky; top: 0; z-index: 5;
  }
  .logo { font: 600 20px/1 Georgia, "Iowan Old Style", serif; letter-spacing: .02em; }
  .konum { color: var(--soluk); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .ikon-dugme {
    border: 1px solid var(--cizgi); background: transparent; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; white-space: nowrap;
  }
  .ikon-dugme:hover { background: var(--vurgu-yumusak); }
  .ikon-dugme[aria-pressed="true"] { background: var(--vurgu-yumusak); border-color: var(--vurgu); }

  /* Düzen */
  .duzen { flex: 1; display: flex; min-height: 0; }
  #akis { flex: 1; overflow-y: auto; padding: 24px 16px 8px; scroll-behavior: smooth; }
  .akis-ic { max-width: 700px; margin: 0 auto; }

  /* Sahne */
  .sahne { margin-bottom: 28px; animation: belir .35s ease-out; }
  @keyframes belir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .sahne-baslik {
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soluk);
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .sahne-baslik::after { content: ""; flex: 1; height: 1px; background: var(--cizgi); }
  .eylem {
    margin: 0 0 14px auto; width: fit-content; max-width: 85%;
    background: var(--vurgu); color: #fff8f0; padding: 8px 14px; border-radius: 14px 14px 4px 14px;
    font-size: 14px;
  }
  :root[data-tema="koyu"] .eylem { color: #1b140f; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="acik"]) .eylem { color: #1b140f; } }
  .anlatim { font: 17px/1.75 Georgia, "Iowan Old Style", "Times New Roman", serif; margin: 0 0 12px; }
  .replik {
    margin: 0 0 12px; padding: 10px 14px; background: var(--replik);
    border-left: 3px solid var(--vurgu); border-radius: 0 10px 10px 0;
  }
  .replik .kim { font-size: 12px; font-weight: 600; color: var(--vurgu); letter-spacing: .02em; margin-bottom: 2px; }
  .replik .soz { font: italic 17px/1.6 Georgia, "Iowan Old Style", serif; }

  .yaziyor { color: var(--soluk); font-style: italic; padding: 8px 0 24px; display: none; }
  .yaziyor.gorunur { display: block; }
  .yaziyor span { animation: nokta 1.2s infinite; }
  .yaziyor span:nth-child(2) { animation-delay: .2s; } .yaziyor span:nth-child(3) { animation-delay: .4s; }
  @keyframes nokta { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }

  /* Alt giriş alanı */
  #giris { border-top: 1px solid var(--cizgi); background: var(--kagit); padding: 12px 16px 14px; }
  .giris-ic { max-width: 700px; margin: 0 auto; }
  #secenekler { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .secenek {
    text-align: left; border: 1px solid var(--cizgi); background: var(--zemin);
    padding: 9px 12px; border-radius: 10px; display: flex; gap: 10px; align-items: baseline;
  }
  .secenek:hover:not(:disabled) { border-color: var(--vurgu); background: var(--vurgu-yumusak); }
  .secenek .no { color: var(--vurgu); font-weight: 600; font-size: 13px; min-width: 14px; }
  .serbest { display: flex; gap: 8px; }
  .serbest input {
    flex: 1; min-width: 0; border: 1px solid var(--cizgi); background: var(--zemin);
    border-radius: 10px; padding: 10px 12px;
  }
  .serbest input:focus, .secenek:focus-visible, button:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 1px; }
  .ana-dugme {
    border: 0; background: var(--vurgu); color: #fff8f0; border-radius: 10px; padding: 10px 16px; font-weight: 600;
  }
  :root[data-tema="koyu"] .ana-dugme { color: #1b140f; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="acik"]) .ana-dugme { color: #1b140f; } }
  button:disabled, input:disabled { opacity: .5; cursor: default; }

  /* Editör paneli */
  #panel {
    width: 360px; border-left: 1px solid var(--cizgi); background: var(--kagit);
    display: flex; flex-direction: column; min-height: 0;
  }
  #panel[hidden] { display: none; }
  .sekmeler { display: flex; border-bottom: 1px solid var(--cizgi); }
  .sekme { flex: 1; border: 0; background: transparent; padding: 10px 4px; font-size: 13px; color: var(--soluk); border-bottom: 2px solid transparent; }
  .sekme[aria-selected="true"] { color: var(--murekkep); border-bottom-color: var(--vurgu); font-weight: 600; }
  .panel-ic { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .panel-ic h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--soluk); margin: 16px 0 6px; }
  .panel-ic h3:first-child { margin-top: 0; }
  .kart { background: var(--zemin); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 13.5px; }
  .kart.kirmizi { background: var(--kirmizi-zemin); color: var(--kirmizi); }
  .kart.yesil { background: var(--yesil-zemin); color: var(--yesil); }
  .kart.mavi { background: var(--mavi-zemin); color: var(--mavi); }
  .kart small { display: block; color: var(--soluk); margin-top: 2px; }
  .bos { color: var(--soluk); font-size: 13px; font-style: italic; }
  .rozet { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--vurgu-yumusak); color: var(--vurgu); margin-left: 4px; }
  .sayaclar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--cizgi); padding: 10px 16px; font-size: 12px; color: var(--soluk); }
  .sayaclar b { display: block; font-size: 16px; color: var(--murekkep); font-variant-numeric: tabular-nums; }

  /* Başlangıç penceresi ve bildirim */
  #baslangic {
    position: fixed; inset: 0; background: rgba(30,20,12,.55); display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 20;
  }
  #baslangic[hidden] { display: none; }
  .pencere { background: var(--kagit); border-radius: 16px; padding: 24px; width: 100%; max-width: 440px; box-shadow: var(--golge); }
  .pencere h1 { font: 600 28px/1.1 Georgia, serif; margin: 0 0 6px; }
  .pencere p { color: var(--soluk); margin: 0 0 18px; }
  .alan { margin-bottom: 14px; }
  .alan label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .alan select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--cizgi); background: var(--zemin); }
  .alan small { display: block; color: var(--soluk); margin-top: 4px; font-size: 12px; }
  .pencere .dugmeler { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  #bildirim {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
    background: var(--kirmizi); color: #fff; padding: 10px 14px; border-radius: 10px; box-shadow: var(--golge); z-index: 30; font-size: 14px;
  }
  #bildirim[hidden] { display: none; }
  #bildirim.iyi { background: var(--yesil); }

  /* Dünya kurucu */
  .perde {
    position: fixed; inset: 0; background: rgba(30,20,12,.55); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 20;
  }
  .perde[hidden] { display: none; }
  .pencere.genis { max-width: 640px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .adim-ust { display: flex; align-items: baseline; gap: 12px; }
  .adim-ust h2 { font: 600 22px/1.2 Georgia, serif; margin: 0; flex: 1; }
  .adim-sayac { color: var(--soluk); font-size: 13px; white-space: nowrap; }
  .adim-ipucu { color: var(--soluk); font-size: 13.5px; margin: 6px 0 14px; }
  .adim-icerik { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
  .adim-icerik input[type=text], .adim-icerik input[type=number], .adim-icerik textarea, .adim-icerik select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--cizgi); background: var(--zemin);
  }
  .adim-icerik textarea { resize: vertical; font: inherit; }
  .adim-icerik .onay { display: flex; align-items: center; gap: 8px; }
  .adim-icerik .onay label { margin: 0; font-weight: 400; }
  .kalem { border: 1px solid var(--cizgi); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .kalem legend { font-size: 12px; font-weight: 600; color: var(--vurgu); padding: 0 4px; }
  .onizleme h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soluk); }
  .onizleme p, .onizleme li { margin: 2px 0; font-size: 14px; }
  .bosluk { flex: 1; }
  .kur-ek { display: flex; gap: 8px; flex-wrap: wrap; }
  .pencere .dugmeler { flex-wrap: wrap; }
  .kayitli-liste { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; }
  .kayitli-oge { display: flex; align-items: center; gap: 8px; background: var(--zemin); border-radius: 8px; padding: 7px 10px; }
  .kayitli-oge .bilgi { flex: 1; min-width: 0; font-size: 13.5px; }
  .kayitli-oge .bilgi small { display: block; color: var(--soluk); font-size: 12px; }
  .manga-serit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .manga-serit:empty { display: none; }
  .manga-serit img { height: 150px; border: 1px solid var(--cizgi); border-radius: 4px; background: var(--zemin); }
  .manga-serit small { color: var(--soluk); font-size: 12px; }
  .manga-serit small.hata { color: var(--kirmizi); }
  .alan .yan-yana { display: flex; gap: 8px; }
  .alan .yan-yana select { flex: 1; min-width: 0; }
  .baglanti { border: 0; background: none; color: var(--vurgu); padding: 0; font-size: 12.5px; text-decoration: underline; }

  /* Telefon */
  @media (max-width: 900px) {
    #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); z-index: 10; box-shadow: var(--golge); }
    .anlatim, .replik .soz { font-size: 16px; }
    .konum { display: none; }
  }
  @media (max-width: 480px) { .dar-gizle { display: none; } }
</style>
</head>
<body>
<header>
  <div class="logo" id="baslik">Tuzhan</div>
  <div class="konum" id="konum"></div>
  <button class="ikon-dugme" id="panel-dugme" aria-pressed="false" title="Editörün bulgularını göster">Editör</button>
  <button class="ikon-dugme" id="manga-dugme" title="Bu oyunun manga sayfaları" hidden>Manga</button>
  <button class="ikon-dugme" id="kur-dugme" title="Kendi dünyanı kur">Dünya kur</button>
  <button class="ikon-dugme" id="yeni-dugme" title="Kayıtlı oyunlar ve yeni oyun">Oyunlar</button>
  <button class="ikon-dugme" id="tema-dugme" title="Tema">◐</button>
</header>

<div class="duzen">
  <main id="akis" aria-live="polite">
    <div class="akis-ic">
      <div id="sahneler"></div>
      <div class="yaziyor" id="yaziyor">Anlatıcı yazıyor<span>.</span><span>.</span><span>.</span></div>
    </div>
  </main>

  <aside id="panel" hidden>
    <div class="sekmeler" role="tablist">
      <button class="sekme" role="tab" data-sekme="editor" aria-selected="true">Bu sahne</button>
      <button class="sekme" role="tab" data-sekme="vaatler" aria-selected="false">Vaatler</button>
      <button class="sekme" role="tab" data-sekme="dunya" aria-selected="false">Dünya</button>
    </div>
    <div class="panel-ic" id="panel-ic"></div>
    <div class="sayaclar" id="sayaclar"></div>
  </aside>
</div>

<footer id="giris">
  <div class="giris-ic">
    <div id="secenekler"></div>
    <form class="serbest" id="serbest-form">
      <input id="serbest" maxlength="300" placeholder="Ya da ne yapacağını kendin yaz…" autocomplete="off">
      <button class="ana-dugme" type="submit">Gönder</button>
      <button class="ikon-dugme" type="button" id="yeniden-dugme" title="Son sahneyi aynı eylemle yeniden yazdır">↻<span class="dar-gizle"> Yeniden yaz</span></button>
    </form>
  </div>
</footer>

<div id="baslangic" hidden>
  <form class="pencere" id="baslangic-form">
    <h1>Hikâye Oyunu</h1>
    <p>Seçimlerinle ilerleyen bir hikâye. Kayıtlı bir oyuna devam et ya da yenisini başlat.</p>
    <div class="alan" id="kayitli" hidden>
      <label>Kayıtlı oyunların</label>
      <div id="kayitli-liste" class="kayitli-liste"></div>
      <small>Oyunlar her turdan sonra kendiliğinden kaydedilir.</small>
    </div>
    <div class="alan">
      <label for="dunya-sec">Dünya</label>
      <select id="dunya-sec"></select>
      <small><button type="button" class="baglanti" id="kur-baglanti">+ Kendi dünyanı kur</button></small>
    </div>
    <div class="alan">
      <label for="bellek-sec">Hafıza</label>
      <select id="bellek-sec"></select>
      <small id="bellek-aciklama"></small>
    </div>
    <div class="alan">
      <label for="editor-sec">Editör</label>
      <select id="editor-sec"></select>
      <small id="editor-aciklama"></small>
    </div>
    <div class="alan">
      <label for="yazar-sec">Yazar modeli</label>
      <select id="yazar-sec"></select>
      <small id="yazar-aciklama"></small>
    </div>
    <div class="alan">
      <label for="manga-sec">Manga</label>
      <div class="yan-yana">
        <select id="manga-sec">
          <option value="">Kapalı</option>
          <option value="siyahbeyaz">Siyah-beyaz</option>
          <option value="renkli">Renkli</option>
        </select>
        <select id="manga-kaynak" title="Görsel kaynağı"></select>
      </div>
      <small id="manga-aciklama"></small>
    </div>
    <div class="dugmeler">
      <button type="button" class="ikon-dugme" id="vazgec">Vazgeç</button>
      <button type="submit" class="ana-dugme">Başla</button>
    </div>
  </form>
</div>

<div id="kurucu" class="perde" hidden>
  <form class="pencere genis" id="kurucu-form" novalidate>
    <div class="adim-ust">
      <h2 id="adim-baslik"></h2>
      <span class="adim-sayac" id="adim-sayac"></span>
    </div>
    <p class="adim-ipucu" id="adim-ipucu"></p>
    <div class="adim-icerik" id="adim-icerik"></div>
    <div class="dugmeler">
      <button type="button" class="ikon-dugme" id="kur-kapat">Kapat</button>
      <span class="bosluk"></span>
      <span id="kur-ek" class="kur-ek"></span>
      <button type="button" class="ikon-dugme" id="kur-geri">Geri</button>
      <button type="submit" class="ana-dugme" id="kur-ileri">İleri</button>
    </div>
  </form>
</div>

<div id="bildirim" role="alert" hidden></div>

<script>
const ACIKLAMA = {
  bellek: {
    tam: "Model her turda hikâyenin tamamını görür (önerilen).",
    son: "Yalnızca son 2 sahne. En ucuzu, en çok unutanı.",
    ozet: "Son 2 sahne + hikâye özeti.",
    kanon: "Son 2 sahne + dünyadan ilgili olgular.",
    "ozet+kanon": "Son 2 sahne + özet + ilgili olgular. Çok uzun oyunlar için.",
  },
  editor: {
    tam: "Tutarlılık denetimi + usta yazar ölçütleriyle yazara not (önerilen).",
    denetim: "Yalnızca tutarlılık, karakter ve vaat denetimi. Biraz daha ucuz.",
    yok: "Editör kapalı. En hızlı, en az tutarlı.",
  },
  yazar: {},          // sunucudan gelir (/api/ayarlar)
};

const $ = (s) => document.querySelector(s);
const durum = { mesgul: false, sekme: "editor", son: null, secenekler: [], mangaKaynaklari: {}, mangaZamanlayici: null };

function el(etiket, sinif, metin) {
  const e = document.createElement(etiket);
  if (sinif) e.className = sinif;
  if (metin !== undefined) e.textContent = metin;
  return e;
}

async function api(yol, govde) {
  const yanit = await fetch(yol, govde === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(govde),
  });
  const veri = await yanit.json().catch(() => ({ hata: "Sunucudan geçersiz yanıt geldi." }));
  if (!yanit.ok) throw new Error(veri.hata || `Hata ${yanit.status}`);
  return veri;
}

function bildir(mesaj, iyi = false, sure = 7000) {
  const b = $("#bildirim");
  b.textContent = mesaj;
  b.classList.toggle("iyi", iyi);
  b.hidden = false;
  clearTimeout(bildir.zaman);
  bildir.zaman = setTimeout(() => (b.hidden = true), sure);
}

function mesgulOl(evet) {
  durum.mesgul = evet;
  $("#yaziyor").classList.toggle("gorunur", evet);
  document.querySelectorAll("#giris button, #giris input").forEach((e) => (e.disabled = evet));
  if (evet) asagiKaydir();
}

function asagiKaydir() {
  requestAnimationFrame(() => { const a = $("#akis"); a.scrollTop = a.scrollHeight; });
}

/* ── Sahne çizimi ─────────────────────────────────────────── */
function sahneCiz(s) {
  const kutu = el("article", "sahne");
  const baslik = [`Sahne ${s.no}`, s.mekan, s.zaman].filter(Boolean).join(" · ");
  kutu.append(el("div", "sahne-baslik", baslik));
  if (s.eylem) kutu.append(el("div", "eylem", s.eylem));
  for (const p of s.parcalar) {
    if (p.tur === "replik") {
      const r = el("div", "replik");
      r.append(el("div", "kim", p.ad), el("div", "soz", `“${p.metin}”`));
      kutu.append(r);
    } else {
      kutu.append(el("p", "anlatim", p.metin));
    }
  }
  const serit = el("div", "manga-serit");
  serit.dataset.no = s.no;
  kutu.append(serit);
  $("#sahneler").append(kutu);
}

/* ── Manga ────────────────────────────────────────────────── */
const MANGA_DURUM = { bekliyor: "Manga sırada…", ciziliyor: "Manga çiziliyor…" };

function mangaAyari() {
  const stil = $("#manga-sec").value;
  return { acik: Boolean(stil), stil: stil || "siyahbeyaz", kaynak: $("#manga-kaynak").value };
}

function mangaAciklamasi() {
  const k = $("#manga-kaynak");
  const hazir = durum.mangaKaynaklari[k.value];
  k.hidden = !$("#manga-sec").value;
  $("#manga-aciklama").textContent = !$("#manga-sec").value
    ? "Her sahneden 2-4 panel çizilir. Görsel üretimi ek maliyet demek; kapalıyken hiçbir şey çizilmez."
    : hazir ? "Paneller arka planda çizilir, oyun beklemez."
            : `Bu kaynağın adresi yok: .env içine MANGA_${k.value.toUpperCase()}_ADRES yaz.`;
}

function mangaCiz(m) {
  for (const [no, d] of Object.entries(m.sahneler || {})) {
    const serit = document.querySelector(`.manga-serit[data-no="${no}"]`);
    if (!serit) continue;
    if (d.durum === "hazir") {
      serit.replaceChildren(...d.paneller.map((url) => {
        const a = el("a");
        a.href = url;
        a.target = "_blank";
        const img = el("img");
        img.src = url;
        img.alt = `Sahne ${no} paneli`;
        img.loading = "lazy";
        a.append(img);
        return a;
      }));
    } else if (d.durum === "hata") {
      serit.replaceChildren(el("small", "hata", `Manga çizilemedi: ${d.hata}`));
    } else {
      serit.replaceChildren(el("small", "", MANGA_DURUM[d.durum] || ""));
    }
  }
}

function mangaSuruyor(m) {
  return Object.values(m.sahneler || {}).some((d) => d.durum === "bekliyor" || d.durum === "ciziliyor")
    || (m.is && m.is.durum === "calisiyor");
}

/* Oynanan oyunun panellerini sorar; çizilen varsa birkaç saniyede bir yeniden. */
async function mangaYokla() {
  clearTimeout(durum.mangaZamanlayici);
  const kimlik = durum.son && durum.son.kimlik;
  $("#manga-dugme").hidden = !kimlik;
  if (!kimlik) return;
  try {
    const m = await api(`/api/manga?kimlik=${encodeURIComponent(kimlik)}`);
    if (!durum.son || durum.son.kimlik !== kimlik) return;
    mangaCiz(m);
    if (mangaSuruyor(m)) durum.mangaZamanlayici = setTimeout(mangaYokla, 3000);
  } catch { /* manga oyunu durdurmasın */ }
}

async function mangaSayfalariAc(kimlik) {
  const pencere = window.open("about:blank", "_blank");     // açılır pencere engeline takılmasın
  try {
    await api("/api/manga/sayfalar", { kimlik });
    if (pencere) pencere.location = `/manga/${encodeURIComponent(kimlik)}/`;
  } catch (e) {
    if (pencere) pencere.close();
    bildir(e.message);
  }
}

async function mangaDugmesi() {
  const v = durum.son;
  if (!v || !v.kimlik) return;
  if (v.manga && v.manga.acik) return mangaSayfalariAc(v.kimlik);
  if (!confirm("Bu oyunda manga kapalı. Açılsın mı? Bundan sonraki sahneler (ve son sahne) çizilir; görsel üretimi ek maliyet demek.\n\nStil ve kaynak, Oyunlar penceresindeki Manga seçiminden alınır.")) {
    return mangaSayfalariAc(v.kimlik);
  }
  try {
    const ayar = { ...mangaAyari(), acik: true };
    const m = await api("/api/manga/ayar", ayar);
    durum.son.manga = m.manga;
    bildir("Manga açıldı; paneller arka planda çiziliyor.", true, 4000);
    mangaYokla();
  } catch (e) {
    bildir(e.message);
  }
}

/* Kayıtlı bir oyunun tamamından manga (arka planda); ilerleme satırda görünür. */
async function kayittanManga(kimlik, durumYazisi) {
  const ayar = { ...mangaAyari(), acik: true };
  try {
    let m = await api("/api/manga/kayit", { kimlik, ...ayar });
    while (mangaSuruyor(m)) {
      const is_ = m.is || { biten: 0, toplam: 0 };
      durumYazisi.textContent = `Manga: ${is_.biten}/${is_.toplam} sahne çizildi…`;
      await new Promise((t) => setTimeout(t, 3000));
      m = await api(`/api/manga?kimlik=${encodeURIComponent(kimlik)}`);
    }
    const hata = m.is && m.is.hata;
    durumYazisi.textContent = hata ? `Manga: bazı sahneler çizilemedi (${hata})` : `Manga hazır: ${m.sayfalar.length} sayfa`;
    if (m.sayfalar.length) {
      const a = el("a", "baglanti", " Sayfaları aç");
      a.href = `/manga/${encodeURIComponent(kimlik)}/`;
      a.target = "_blank";
      durumYazisi.append(a);
    }
  } catch (e) {
    durumYazisi.textContent = "";
    bildir(e.message);
  }
}

function secenekleriCiz(secenekler) {
  durum.secenekler = secenekler;
  const kutu = $("#secenekler");
  kutu.replaceChildren();
  secenekler.forEach((metin, i) => {
    const d = el("button", "secenek");
    d.type = "button";
    d.append(el("span", "no", String(i + 1)), el("span", "", metin));
    d.addEventListener("click", () => oyna(metin));
    kutu.append(d);
  });
}

function ustBilgi(v) {
  $("#baslik").textContent = v.dunya || "Tuzhan";
  $("#konum").textContent = [v.mekan, v.zaman].filter(Boolean).join(" · ");
}

/* ── Editör paneli ────────────────────────────────────────── */
function liste(baslik, ogeler, sinif, bosMetin) {
  const parca = document.createDocumentFragment();
  parca.append(el("h3", "", baslik));
  if (!ogeler.length) { if (bosMetin) parca.append(el("div", "bos", bosMetin)); return parca; }
  for (const o of ogeler) {
    const k = el("div", `kart ${sinif || ""}`);
    if (typeof o === "string") k.textContent = o;
    else { k.textContent = o.ust; if (o.alt) k.append(el("small", "", o.alt)); }
    parca.append(k);
  }
  return parca;
}

function paneliCiz() {
  const v = durum.son;
  const ic = $("#panel-ic");
  ic.replaceChildren();
  if (!v) { ic.append(el("div", "bos", "Henüz oyun yok.")); return; }

  if (durum.sekme === "editor") {
    const e = v.editor;
    if (!e) {
      ic.append(el("div", "bos", v.ayar && v.ayar.editor === "yok"
        ? "Editör kapalı." : "Editör bu sahne için geçerli yanıt vermedi."));
    } else {
      ic.append(liste("Çelişkiler", e.celiskiler.map((c) => ({ ust: c.yazilan, alt: `Doğrusu: ${c.dogrusu}` })), "kirmizi", "Çelişki yok."));
      ic.append(liste("Karakter uyarıları", e.karakter, "kirmizi", "Karakterler kartlarına uygun."));
      ic.append(liste("Yeni olgular", e.yeni_olgular, "", "Yok."));
      const vaatler = [...e.vaat_acilan.map((m) => ({ ust: m, alt: "yeni açıldı" })),
                       ...e.vaat_ilerleyen.map((m) => ({ ust: m, alt: "ilerledi" })),
                       ...e.vaat_cozulen.map((m) => ({ ust: m, alt: "çözüldü" }))];
      ic.append(liste("Vaatler", vaatler, "mavi", "Bu sahnede değişiklik yok."));
      if (e.zanaat_toplam) {
        const zayif = e.zanaat_zayif.length ? ` · zayıf: ${e.zanaat_zayif.join(", ")}` : "";
        ic.append(liste("Yazım ölçütleri", [`${e.zanaat_iyi}/${e.zanaat_toplam} iyi${zayif}`], e.zanaat_zayif.length ? "" : "yesil"));
      }
      if (e.yazar_notu) ic.append(liste("Yazara not", [e.yazar_notu], ""));
      const oto = Object.entries(e.otomatik || {}).map(([k, n]) => `${n} × ${k.replaceAll("_", " ")}`);
      if (oto.length) ic.append(liste("Kodun düzelttikleri", oto, ""));
    }
    if (v.uyarilar && v.uyarilar.length) ic.append(liste("Kodun bulduğu sorunlar", v.uyarilar, "kirmizi"));
  } else if (durum.sekme === "vaatler") {
    ic.append(liste("Açık vaatler", v.acik_vaatler.map((x) => ({
      ust: x.metin, alt: `${x.yas} sahnedir açık · ${x.ilerleme} kez ilerledi` })), "mavi", "Açık vaat yok."));
    ic.append(liste("Çözülenler", v.cozulen_vaatler.map((x) => ({ ust: x.metin, alt: `${x.sahne}. sahnede çözüldü` })), "yesil", "Henüz yok."));
  } else {
    ic.append(liste("Üzerindekiler", [`${(v.esyalar || []).join(", ") || "hiçbir eşya"} · ${v.akce ?? 0} ${v.para_birimi || "akçe"}`], ""));
    ic.append(liste("Adını bildiğin karakterler", v.taninan, "", "Henüz kimseyle tanışmadın."));
    ic.append(liste("Karakter değişimleri", v.degisimler, "", "Henüz yok."));
    ic.append(liste("Oyunda kesinleşenler (son 12)", [...v.olgular].reverse(), "", "Henüz yok."));
    ic.append(liste("Ayarlar", [`Hafıza: ${v.ayar.bellek} · Editör: ${v.ayar.editor} · Yazar: ${v.ayar.yazar}`, v.ayar.model], ""));
  }

  const s = v.sayac, h = v.harcama;
  const sayaclar = $("#sayaclar");
  sayaclar.replaceChildren();
  const hucre = (etiket, deger) => { const d = el("div", "", etiket); d.prepend(el("b", "", deger)); return d; };
  sayaclar.append(
    hucre("sahne", s.sahne), hucre("çelişki", s.celiski), hucre("karakter sapması", s.sapma),
    hucre("olgu", s.olgu), hucre("vaat", s.vaat),
    hucre(h.tam_degil ? "harcama (eksik)" : "tahmini harcama", `$${h.dolar.toFixed(3)}`),
  );
}

/* ── Oyun akışı ───────────────────────────────────────────── */
function yanitiIsle(v) {
  durum.son = v;
  sahneCiz(v.sahne);
  secenekleriCiz(v.sahne.secenekler);
  ustBilgi(v);
  paneliCiz();
  asagiKaydir();
  mangaYokla();
}

async function oyna(eylem) {
  eylem = (eylem || "").trim();
  if (!eylem || durum.mesgul) return;
  const onizleme = el("div", "eylem", eylem);
  $("#sahneler").append(onizleme);
  mesgulOl(true);
  try {
    const v = await api("/api/oyna", { eylem });
    onizleme.remove();
    $("#serbest").value = "";
    yanitiIsle(v);
  } catch (e) {
    onizleme.remove();
    bildir(e.message);
  } finally {
    mesgulOl(false);
  }
}

async function yenidenYaz() {
  if (durum.mesgul || !durum.son) return;
  const son = $("#sahneler").lastElementChild;
  if (son) son.remove();
  secenekleriCiz([]);
  mesgulOl(true);
  try {
    yanitiIsle(await api("/api/yeniden", {}));
  } catch (e) {
    bildir(e.message);
    await durumuYukle();          // sunucudaki gerçek durumla yeniden eşitle
  } finally {
    mesgulOl(false);
  }
}

/* Sunucudaki oyunu baştan çizer (sayfa yenilenince ya da bir hatadan sonra). */
async function durumuYukle() {
  return oyunuCiz(await api("/api/durum"));
}

/* Sunucudan gelen bir oyunu (tüm sahneleriyle) çizer: sayfa yenilenince ya da kayıttan devamda. */
function oyunuCiz(d) {
  $("#sahneler").replaceChildren();
  if (!d.oyun_var || !d.sahneler.length) {
    durum.son = null;
    secenekleriCiz([]);
    paneliCiz();
    return false;
  }
  d.sahneler.forEach(sahneCiz);
  const son = d.sahneler[d.sahneler.length - 1];
  durum.son = { editor: null, uyarilar: [], ...d, sahne: son };
  secenekleriCiz(son.secenekler);
  ustBilgi(d);
  paneliCiz();
  asagiKaydir();
  mangaYokla();
  return true;
}

async function yeniOyun(ayar) {
  $("#baslangic").hidden = true;
  $("#sahneler").replaceChildren();
  secenekleriCiz([]);
  durum.son = null;
  paneliCiz();
  mesgulOl(true);
  try {
    yanitiIsle(await api("/api/yeni", ayar));
  } catch (e) {
    bildir(e.message);
    $("#baslangic").hidden = false;
  } finally {
    mesgulOl(false);
  }
}

/* ── Başlangıç ────────────────────────────────────────────── */
function secenekDoldur(secim, degerler, varsayilan, aciklamalar, aciklamaKutusu) {
  secim.replaceChildren(...degerler.map((d) => { const o = el("option", "", d); o.value = d; return o; }));
  secim.value = varsayilan;
  const guncelle = () => { if (aciklamaKutusu) aciklamaKutusu.textContent = (aciklamalar || {})[secim.value] || ""; };
  secim.onchange = guncelle;
  guncelle();
}

async function basla() {
  temaUygula(localStorageOku("tema"));
  panelAc(localStorageOku("panel") === "acik");
  try {
    const a = await api("/api/ayarlar");
    dunyaListesiDoldur(a, a.varsayilan.dunya);
    secenekDoldur($("#bellek-sec"), a.bellekler, a.varsayilan.bellek, ACIKLAMA.bellek, $("#bellek-aciklama"));
    secenekDoldur($("#editor-sec"), a.editorler, a.varsayilan.editor, ACIKLAMA.editor, $("#editor-aciklama"));
    ACIKLAMA.yazar = a.yazarlar || {};
    secenekDoldur($("#yazar-sec"), Object.keys(ACIKLAMA.yazar), a.varsayilan.yazar, ACIKLAMA.yazar, $("#yazar-aciklama"));
    durum.mangaKaynaklari = a.manga.kaynaklar;
    const kaynaklar = Object.keys(a.manga.kaynaklar);
    $("#manga-kaynak").replaceChildren(...kaynaklar.map((k) => {
      const o = el("option", "", a.manga.kaynaklar[k] ? k : `${k} (adres yok)`);
      o.value = k;
      return o;
    }));
    $("#manga-kaynak").value = kaynaklar.find((k) => a.manga.kaynaklar[k]) || kaynaklar[0];
    $("#manga-sec").value = localStorageOku("manga") || "";
    $("#manga-sec").onchange = () => { localStorageYaz("manga", $("#manga-sec").value); mangaAciklamasi(); };
    $("#manga-kaynak").onchange = mangaAciklamasi;
    mangaAciklamasi();
    if (!(a.oyun_var && await durumuYukle())) baslangicAc();
  } catch (e) {
    bildir(`Sunucuya bağlanılamadı: ${e.message}`);
  }
}

function localStorageOku(anahtar) { try { return localStorage.getItem(anahtar); } catch { return null; } }
function localStorageYaz(anahtar, deger) { try { localStorage.setItem(anahtar, deger); } catch { /* yok say */ } }

function temaUygula(tema) {
  if (tema) document.documentElement.dataset.tema = tema;
  else delete document.documentElement.dataset.tema;
}

function panelAc(acik) {
  $("#panel").hidden = !acik;
  $("#panel-dugme").setAttribute("aria-pressed", String(acik));
  localStorageYaz("panel", acik ? "acik" : "kapali");
}

$("#baslangic-form").addEventListener("submit", (e) => {
  e.preventDefault();
  yeniOyun({ dunya: $("#dunya-sec").value, bellek: $("#bellek-sec").value,
             editor: $("#editor-sec").value, yazar: $("#yazar-sec").value, manga: mangaAyari() });
});
$("#yeniden-dugme").addEventListener("click", yenidenYaz);
$("#manga-dugme").addEventListener("click", mangaDugmesi);
$("#vazgec").addEventListener("click", () => ($("#baslangic").hidden = true));
$("#yeni-dugme").addEventListener("click", () => { if (!durum.mesgul) baslangicAc(); });

/* ── Kayıtlı oyunlar ──────────────────────────────────────── */
function baslangicAc() {
  $("#vazgec").hidden = !durum.son;
  $("#baslangic").hidden = false;
  kayitlariYukle();
}

function tarihYaz(iso) {
  const t = new Date(iso);
  return isNaN(t) ? "" : t.toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}

async function kayitlariYukle() {
  try {
    kayitlariCiz(await api("/api/kayitlar"));
  } catch { $("#kayitli").hidden = true; }
}

function kayitlariCiz(v) {
  const liste = $("#kayitli-liste");
  liste.replaceChildren();
  $("#kayitli").hidden = !v.kayitlar.length;
  for (const k of v.kayitlar) {
    const oge = el("div", "kayitli-oge");
    const bilgi = el("div", "bilgi", `${k.dunya_ad} · ${k.sahne} sahne`);
    const oynanan = k.kimlik === v.oynanan;
    bilgi.append(el("small", "", [oynanan ? "şu an oynanan" : "", k.oyun_zamani, tarihYaz(k.zaman)].filter(Boolean).join(" · ")));
    const mangaYazisi = el("small", "");
    bilgi.append(mangaYazisi);
    const devam = el("button", "ana-dugme", oynanan ? "Dön" : "Devam et");
    devam.type = "button";
    devam.onclick = () => (oynanan ? ($("#baslangic").hidden = true) : devamEt(k.kimlik));
    const manga = el("button", "ikon-dugme", "Manga");
    manga.type = "button";
    manga.title = "Bu oyunun tamamından manga oluştur (seçili stil ve kaynakla)";
    manga.onclick = () => kayittanManga(k.kimlik, mangaYazisi);
    oge.append(bilgi, devam, manga);
    if (!oynanan) {
      const sil = el("button", "ikon-dugme", "Sil");
      sil.type = "button";
      sil.onclick = () => kayitSil(k.kimlik, k.dunya_ad);
      oge.append(sil);
    }
    liste.append(oge);
  }
}

async function devamEt(kimlik) {
  $("#baslangic").hidden = true;
  $("#sahneler").replaceChildren();
  secenekleriCiz([]);
  mesgulOl(true);
  try {
    oyunuCiz(await api("/api/devam", { kimlik }));
    bildir("Kaldığın yerden devam ediyorsun.", true, 4000);
  } catch (e) {
    bildir(e.message);
    baslangicAc();
  } finally {
    mesgulOl(false);
  }
}

async function kayitSil(kimlik, ad) {
  if (!confirm(`"${ad}" kaydı silinsin mi? Bu geri alınamaz.`)) return;
  try {
    kayitlariCiz(await api("/api/kayit/sil", { kimlik }));
  } catch (e) { bildir(e.message); }
}
$("#serbest-form").addEventListener("submit", (e) => { e.preventDefault(); oyna($("#serbest").value); });
$("#panel-dugme").addEventListener("click", () => panelAc($("#panel").hidden));
$("#tema-dugme").addEventListener("click", () => {
  const karanlik = document.documentElement.dataset.tema
    ? document.documentElement.dataset.tema === "koyu"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const yeni = karanlik ? "acik" : "koyu";
  temaUygula(yeni);
  localStorageYaz("tema", yeni);
});
document.querySelectorAll(".sekme").forEach((s) => s.addEventListener("click", () => {
  durum.sekme = s.dataset.sekme;
  document.querySelectorAll(".sekme").forEach((x) => x.setAttribute("aria-selected", String(x === s)));
  paneliCiz();
}));
document.addEventListener("keydown", (e) => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName) || !$("#baslangic").hidden || !$("#kurucu").hidden) return;
  const n = Number(e.key);
  if (n >= 1 && n <= durum.secenekler.length) oyna(durum.secenekler[n - 1]);
});

function dunyaListesiDoldur(a, secili) {
  const secim = $("#dunya-sec");
  secim.replaceChildren(...a.dunyalar.map((d) => {
    const o = el("option", "", (a.dunya_adlari || {})[d] || d);
    o.value = d;
    return o;
  }));
  secim.value = a.dunyalar.includes(secili) ? secili : a.varsayilan.dunya;
}

/* ── Dünya kurucu: oyuncu kendi dünyasını yazar; yapay zekâ hiçbir alanı doldurmaz ── */
const TURLER = ["Fantastik", "Bilimkurgu", "Tarihî", "Polisiye", "Korku", "Günümüz", "Masal", "Diğer"];
const bosKarakter = () => ({ ad: "", kisa_ad: "", adsiz: false, gorunus: "", gorunen_ad: "", kisilik: "",
                            konusma: "", imza: "", ornek: "", sir: "", yer: "" });
const bosTaslak = () => ({
  ad: "", tur: "Fantastik", ton: "", donem: "", yoklar: "", para_birimi: "akçe",
  oyuncu: { kim: "", neden: "", esyalar: "", para: 10 }, sir: "",
  mekanlar: [{ ad: "", tanim: "" }], karakterler: [bosKarakter()], gercekler: "",
  acilis: { mekan: "", zaman: "1. gün, sabah", metin: "" },
});
let taslak = null;
let adim = 0;
let alanNo = 0;

function taslakYaz() { localStorageYaz("dunya_taslak", JSON.stringify(taslak)); }
function taslakOku() { try { return JSON.parse(localStorageOku("dunya_taslak") || "null"); } catch { return null; } }

function alan(kutu, nesne, anahtar, etiket, s = {}) {
  const d = el("div", s.tur === "onay" ? "alan onay" : "alan");
  const id = `kurucu-${alanNo++}`;
  const l = el("label", "", etiket + (s.gerekli ? " *" : ""));
  l.htmlFor = id;
  let g;
  if (s.tur === "uzun") { g = el("textarea"); g.rows = s.satir || 3; }
  else if (s.tur === "secim") {
    g = el("select");
    for (const o of s.secenekler) { const op = el("option", "", o || "— seç —"); op.value = o; g.append(op); }
  } else { g = el("input"); g.type = s.tur === "sayi" ? "number" : s.tur === "onay" ? "checkbox" : "text"; }
  g.id = id;
  if (s.tur === "onay") g.checked = !!nesne[anahtar]; else g.value = nesne[anahtar] ?? "";
  if (s.yer) g.placeholder = s.yer;
  g.addEventListener(s.tur === "onay" || s.tur === "secim" ? "change" : "input", () => {
    nesne[anahtar] = s.tur === "onay" ? g.checked : s.tur === "sayi" ? Number(g.value || 0) : g.value;
    taslakYaz();
  });
  if (s.tur === "onay") d.append(g, l); else d.append(l, g);
  if (s.aciklama) d.append(el("small", "", s.aciklama));
  kutu.append(d);
}

function listeCiz(kutu, liste, tekil, alanlar, yeni) {
  liste.forEach((oge, i) => {
    const kart = el("fieldset", "kalem");
    kart.append(el("legend", "", `${tekil} ${i + 1}`));
    alanlar(kart, oge);
    if (liste.length > 1) {
      const sil = el("button", "ikon-dugme", "Kaldır");
      sil.type = "button";
      sil.onclick = () => { liste.splice(i, 1); taslakYaz(); adimCiz(); };
      kart.append(sil);
    }
    kutu.append(kart);
  });
  const ekle = el("button", "ikon-dugme", `+ ${tekil} ekle`);
  ekle.type = "button";
  ekle.onclick = () => { liste.push(yeni()); taslakYaz(); adimCiz(); };
  kutu.append(ekle);
}

const mekanAdlari = () => ["", ...taslak.mekanlar.map((m) => m.ad.trim()).filter(Boolean)];

const ADIMLAR = [
  { baslik: "Tür ve ton",
    ipucu: "Dünyanın adı ve havası. Ton, anlatıcının sesini belirler.",
    ciz: (k) => {
      alan(k, taslak, "ad", "Dünyanın adı", { gerekli: true, yer: "ör. Kızıl Liman, Yedinci Koloni" });
      alan(k, taslak, "tur", "Tür", { tur: "secim", secenekler: TURLER });
      alan(k, taslak, "ton", "Ton", { yer: "ör. karanlık ve gizemli; mizah yalnızca küçük anlarda" });
    },
    dogrula: () => (taslak.ad.trim() ? null : "Dünyaya bir ad ver.") },
  { baslik: "Dünyanın kuralları",
    ipucu: "Model bu kuralları asla çiğnememeye çalışır. Özellikle neyin OLMADIĞINI yazmak, uydurmayı önler.",
    ciz: (k) => {
      alan(k, taslak, "donem", "Dönem ve teknoloji", { tur: "uzun", yer: "ör. Orta çağ benzeri; büyü var ama çok nadir ve korkulur" });
      alan(k, taslak, "yoklar", "Bu dünyada neler YOK? (her satıra bir tane)", { tur: "uzun", satir: 4,
        yer: "ör.\nAteşli silah yok\nKimse uçamaz\nÖlüler geri dönmez" });
    } },
  { baslik: "Oyuncu",
    ipucu: "Oyuncunun kim olduğu ve yanında ne taşıdığı. Oyun, oyuncunun yalnızca bunları kullanabilmesini denetler.",
    ciz: (k) => {
      alan(k, taslak.oyuncu, "kim", "Oyuncu kim?", { gerekli: true, tur: "uzun", yer: "ör. Kasabaya yeni gelmiş genç bir haritacı" });
      alan(k, taslak.oyuncu, "neden", "Neden burada?", { tur: "uzun", yer: "ör. Kaybolan bir kervanı bulmak için tutuldu" });
      alan(k, taslak.oyuncu, "esyalar", "Yanındaki eşyalar (virgülle)", { yer: "ör. pusula, harita defteri, ip" });
      alan(k, taslak.oyuncu, "para", `Parası (${taslak.para_birimi || "akçe"})`, { tur: "sayi" });
    },
    dogrula: () => (taslak.oyuncu.kim.trim() ? null : "Oyuncunun kim olduğunu yaz.") },
  { baslik: "Hikâyenin kalbi",
    ipucu: "Cevabı merak edilen büyük sır ya da sorular. Oyun bunları açık vaat olarak takip eder; hepsini birden çözmez.",
    ciz: (k) => alan(k, taslak, "sir", "Büyük soru(lar) — her satıra bir tane", { tur: "uzun", satir: 4,
      yer: "ör.\nKayıp kervana ne oldu?\nGöldeki ışıklar nereden geliyor?" }) },
  { baslik: "Mekânlar",
    ipucu: "Hikâyenin geçtiği yerler. Tanıma somut ayrıntılar yaz: model bunlarla çelişmemeye çalışır.",
    ciz: (k) => listeCiz(k, taslak.mekanlar, "Mekân", (kart, m) => {
      alan(kart, m, "ad", "Adı", { gerekli: true, yer: "ör. Yıkık Gözetleme Kulesi" });
      alan(kart, m, "tanim", "Tanımı", { tur: "uzun", satir: 2, yer: "ör. Göl kıyısında eski bir kule; merdiveni yarıda çökük" });
    }, () => ({ ad: "", tanim: "" })),
    dogrula: () => (taslak.mekanlar.some((m) => m.ad.trim()) ? null : "En az bir mekân ekle.") },
  { baslik: "Karakterler",
    ipucu: "Konuşma biçimi ve imza sözleri karakterleri birbirinden ayırır. Sırları kanona girer ama oyuncuya hemen açılmaz.",
    ciz: (k) => listeCiz(k, taslak.karakterler, "Karakter", (kart, c) => {
      alan(kart, c, "ad", "Tam adı", { gerekli: true, yer: "ör. Nehir Hanım, Kâtip Selvi" });
      alan(kart, c, "kisa_ad", "Kısaca anılan adı (isteğe bağlı)", { yer: "ör. Nehir",
        aciklama: "Boş bırakırsan unvanlar (Hanım, Kâtip...) atılarak bulunur." });
      alan(kart, c, "adsiz", "Adını kimse bilmiyor", { tur: "onay" });
      alan(kart, c, "gorunus", "Görünüşü", { tur: "uzun", satir: 2, yer: "ör. İri yapılı, elli yaşlarında; sol elinde üç parmağı eksik" });
      alan(kart, c, "gorunen_ad", "Tanışmadan önce nasıl anılır?", { yer: "ör. İri yapılı kadın" });
      alan(kart, c, "kisilik", "Kişiliği", { tur: "uzun", satir: 2, yer: "ör. Sert ve şüpheci ama misafirini korur" });
      alan(kart, c, "konusma", "Nasıl konuşur?", { tur: "uzun", satir: 2, yer: "ör. Kısa, emir kipinde; soruya soruyla karşılık verir" });
      alan(kart, c, "imza", "İmza sözleri (virgülle, yalnızca ona ait)", { yer: "ör. evlat" });
      alan(kart, c, "ornek", "Ağzından çıkabilecek bir cümle", { yer: "ör. Otur, evlat. Önce çorba, sonra soru." });
      alan(kart, c, "sir", "Sırrı (oyuncu hemen öğrenmez)", { tur: "uzun", satir: 2 });
      alan(kart, c, "yer", "Genelde bulunduğu mekân", { tur: "secim", secenekler: mekanAdlari() });
    }, bosKarakter),
    dogrula: () => (taslak.karakterler.some((c) => c.ad.trim()) ? null : "En az bir karakter ekle.") },
  { baslik: "Kesin gerçekler",
    ipucu: "Hikâye boyunca asla değişmeyecek şeyler. Ne kadar somut, o kadar iyi: sayılar, kim neyi biliyor, ne kilitli, kim kimin nesi.",
    ciz: (k) => alan(k, taslak, "gercekler", "Her satıra bir gerçek", { tur: "uzun", satir: 7,
      yer: "ör.\nHanda on iki oda var; yedi numara hep kilitli, anahtarı yalnızca Nehir Hanım'da.\nKervanda on bir deve ve altı kişi vardı." }) },
  { baslik: "Açılış",
    ipucu: "Oyun buradan başlar. Oyuncunun ilk gördüğünü anlat; ilk sahneyi model bundan devam ettirir.",
    ciz: (k) => {
      alan(k, taslak.acilis, "mekan", "Nerede başlıyor?", { tur: "secim", secenekler: mekanAdlari() });
      alan(k, taslak.acilis, "zaman", "Ne zaman?", { yer: "ör. 1. gün, gün batımı" });
      alan(k, taslak.acilis, "metin", "Açılış sahnesi", { gerekli: true, tur: "uzun", satir: 5,
        yer: "ör. Güneş batarken kasabaya varıyorsun. Avlu bomboş; kapıda elinde fenerle biri duruyor." });
    },
    dogrula: () => (taslak.acilis.metin.trim() ? null : "Açılış sahnesini yaz.") },
  { baslik: "Önizleme",
    ipucu: "Her şey doğruysa kaydet. Kaydedilen dünya 'Yeni oyun' listesinde kalır.",
    ciz: (k) => onizlemeCiz(k) },
];

function onizlemeCiz(k) {
  const o = el("div", "onizleme");
  const bolum = (baslik, ogeler) => {
    ogeler = ogeler.filter(Boolean);
    if (!ogeler.length) return;
    o.append(el("h4", "", baslik));
    const ul = el("ul");
    ogeler.forEach((x) => ul.append(el("li", "", x)));
    o.append(ul);
  };
  const satirlar = (m) => (m || "").split("\n").map((x) => x.trim()).filter(Boolean);
  o.append(el("p", "", `${taslak.ad || "(adsız dünya)"} · ${taslak.tur}${taslak.ton ? " · " + taslak.ton : ""}`));
  bolum("Kurallar", [taslak.donem && `Dönem: ${taslak.donem}`, ...satirlar(taslak.yoklar)]);
  bolum("Oyuncu", [taslak.oyuncu.kim, taslak.oyuncu.neden,
                   `Yanında: ${taslak.oyuncu.esyalar || "hiçbir şey"} · ${taslak.oyuncu.para || 0} ${taslak.para_birimi || "akçe"}`]);
  bolum("Büyük sorular", satirlar(taslak.sir));
  bolum("Mekânlar", taslak.mekanlar.filter((m) => m.ad.trim()).map((m) => `${m.ad}${m.tanim ? " — " + m.tanim : ""}`));
  bolum("Karakterler", taslak.karakterler.filter((c) => c.ad.trim()).map((c) =>
    `${c.ad}${c.gorunus ? " — " + c.gorunus : ""}${c.yer ? " (" + c.yer + ")" : ""}`));
  bolum("Kesin gerçekler", satirlar(taslak.gercekler));
  bolum("Açılış", [`${taslak.acilis.mekan || "ilk mekân"} · ${taslak.acilis.zaman}`, taslak.acilis.metin]);
  k.append(o);
}

/* Akış: "fikir" (oyuncu 1-5 kısa cevap) → model taslağı kurar → "onizleme" → Kaydet,
   ya da "adim" (ayrıntılı düzenleme, taslakla dolu). Ayrıntılı kurulum boş da başlatılabilir. */
let kurMod = "fikir";
let fikir = null;
let taslakBilgisi = "";

const bosFikir = () => ({ tur: "", fikir: "", oyuncu: "", olsun: "", olmasin: "" });
function fikirYaz() { localStorageYaz("dunya_fikir", JSON.stringify(fikir)); }
function fikirOku() { try { return JSON.parse(localStorageOku("dunya_fikir") || "null"); } catch { return null; } }

function dugme(metin, tiklaninca) {
  const d = el("button", "ikon-dugme", metin);
  d.type = "button";
  d.onclick = tiklaninca;
  return d;
}

function fikirCiz(k) {
  alan(k, fikir, "tur", "Tür", { tur: "secim", secenekler: ["", ...TURLER] });
  alan(k, fikir, "fikir", "Hikâyeni birkaç cümleyle anlat", { gerekli: true, tur: "uzun", satir: 4,
    yer: "ör. Tuz çölünün kıyısında, kırk gündür kervan uğramayan bir kasaba. Kayıp bir kervanın izini sürüyorum." });
  alan(k, fikir, "oyuncu", "Sen kimsin? (isteğe bağlı)", { yer: "ör. genç bir haritacı" });
  alan(k, fikir, "olsun", "Mutlaka olsun istediklerin (isteğe bağlı)", { tur: "uzun", satir: 2,
    yer: "ör. sır tutan bir hancı, gece görünen mavi ışıklar" });
  alan(k, fikir, "olmasin", "Olmasın istediklerin (isteğe bağlı)", { tur: "uzun", satir: 2, yer: "ör. büyü, ateşli silah" });
  k.querySelectorAll("input, textarea, select").forEach((g) => g.addEventListener("input", fikirYaz));
  k.querySelectorAll("select").forEach((g) => g.addEventListener("change", fikirYaz));
}

function kurucuCiz() {
  const ek = $("#kur-ek");
  ek.replaceChildren();
  const icerik = $("#adim-icerik");
  icerik.replaceChildren();
  icerik.scrollTop = 0;
  const geri = $("#kur-geri");
  if (kurMod === "fikir") {
    $("#adim-baslik").textContent = "Yeni dünya";
    $("#adim-sayac").textContent = "";
    $("#adim-ipucu").textContent = "Birkaç cümle yeter. Gerisini model senin fikrinden yola çıkarak kurar; sonra önizleyip kaydedersin.";
    fikirCiz(icerik);
    geri.hidden = true;
    ek.append(dugme("Ayrıntılı kur", () => { taslak = taslakOku() || bosTaslak(); adim = 0; kurMod = "adim"; kurucuCiz(); }));
    $("#kur-ileri").textContent = "Dünyayı oluştur";
  } else if (kurMod === "onizleme") {
    $("#adim-baslik").textContent = taslak.ad || "Dünya taslağı";
    $("#adim-sayac").textContent = "Önizleme";
    $("#adim-ipucu").textContent = taslakBilgisi || "Beğendiysen kaydet; beğenmediysen yeniden oluştur ya da düzenle.";
    onizlemeCiz(icerik);
    geri.hidden = false;
    geri.textContent = "← Fikre dön";
    ek.append(dugme("Yeniden oluştur", taslakUret), dugme("Düzenle", () => { adim = 0; kurMod = "adim"; kurucuCiz(); }));
    $("#kur-ileri").textContent = "Kaydet";
  } else {
    const a = ADIMLAR[adim];
    $("#adim-baslik").textContent = a.baslik;
    $("#adim-sayac").textContent = `${adim + 1} / ${ADIMLAR.length}`;
    $("#adim-ipucu").textContent = a.ipucu;
    a.ciz(icerik);
    geri.hidden = false;
    geri.textContent = "Geri";
    $("#kur-ileri").textContent = adim === ADIMLAR.length - 1 ? "Kaydet" : "İleri";
  }
}
const adimCiz = kurucuCiz;       // listeCiz ve eski çağrılar için

function kurucuAc() {
  fikir = fikirOku() || bosFikir();
  taslak = taslakOku() || bosTaslak();
  kurMod = "fikir";
  $("#baslangic").hidden = true;
  $("#kurucu").hidden = false;
  kurucuCiz();
}

function kurucuMesgul(evet, mesaj) {
  document.querySelectorAll("#kurucu-form button").forEach((d) => (d.disabled = evet));
  if (evet) $("#adim-ipucu").textContent = mesaj;
}

async function taslakUret() {
  if (!fikir.fikir.trim()) { bildir("Hikâyeni birkaç cümleyle anlat."); return; }
  kurucuMesgul(true, "Dünya kuruluyor… (yaklaşık 10-20 saniye)");
  try {
    const sonuc = await api("/api/dunya/taslak", fikir);
    taslak = sonuc.taslak;
    taslakYaz();
    const maliyet = sonuc.maliyet != null ? ` Bu taslağın maliyeti: ~$${sonuc.maliyet.toFixed(3)}.` : "";
    const ipucu = sonuc.ipuclari.length ? ` Not: ${sonuc.ipuclari.join(" ")}` : "";
    taslakBilgisi = `Beğendiysen kaydet; beğenmediysen yeniden oluştur ya da düzenle.${maliyet}${ipucu}`;
    kurMod = "onizleme";
  } catch (e) {
    bildir(e.message);
  } finally {
    kurucuMesgul(false);
    kurucuCiz();
  }
}

async function dunyayiKaydet() {
  kurucuMesgul(true, "Kaydediliyor…");
  try {
    const sonuc = await api("/api/dunya", taslak);
    try { localStorage.removeItem("dunya_taslak"); localStorage.removeItem("dunya_fikir"); } catch { /* yok say */ }
    $("#kurucu").hidden = true;
    dunyaListesiDoldur(await api("/api/ayarlar"), sonuc.dunya);
    baslangicAc();
    bildir(`"${sonuc.ad}" kaydedildi. Ayarları seçip Başla'ya bas.`, true, 8000);
  } catch (e) {
    bildir(e.message);
  } finally {
    kurucuMesgul(false);
  }
}

$("#kurucu-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (kurMod === "fikir") { taslakUret(); return; }
  if (kurMod === "onizleme") { dunyayiKaydet(); return; }
  const hata = ADIMLAR[adim].dogrula && ADIMLAR[adim].dogrula();
  if (hata) { bildir(hata); return; }
  if (adim === ADIMLAR.length - 1) { dunyayiKaydet(); return; }
  adim += 1;
  kurucuCiz();
});
$("#kur-geri").addEventListener("click", () => {
  if (kurMod === "onizleme") kurMod = "fikir";
  else if (kurMod === "adim" && adim > 0) adim -= 1;
  else if (kurMod === "adim") kurMod = taslak.ad ? "onizleme" : "fikir";
  kurucuCiz();
});
$("#kur-kapat").addEventListener("click", () => {
  $("#kurucu").hidden = true;   // fikir ve taslak saklı kalır; tekrar açınca kaldığın yerden sürer
  if (!durum.son) baslangicAc();
});
$("#kur-dugme").addEventListener("click", () => { if (!durum.mesgul) kurucuAc(); });
$("#kur-baglanti").addEventListener("click", kurucuAc);

basla();
</script>
</body>
</html>
